function candidateCard(p){let locked=p.level>s.level;let z=p.stats||{apps:0,goals:0,assists:0};return `<article class="candidate" data-candidate="${esc(p.id)}" data-name="${esc((p.name+' '+p.club).toLowerCase())}" data-pos="${p.pos}"><div class="candidate-actions"><div><div class="playername">${esc(p.name)}</div><div class="candidate-meta">${esc(p.club)} · ${esc(p.league)} · ${p.age} yaş · ${p.pos} · Bu oyunda ${z.apps} maç</div></div><div class="rating">${p.rating}</div></div><div class="candidate-actions"><span class="small">Maaş beklentisi <b class="price">${fmt(p.wage)}/sezon</b><br>Bonservis tahmini <b class="price">${fmt(p.fee)}</b></span><button class="btn ${locked?'secondary':''}" data-talk="${esc(p.id)}" ${locked?'disabled':''}>${locked?'Seviye '+p.level:'Görüş'}</button></div></article>`}function squadView(){let starters=s.squad.filter(p=>p.starter),bench=s.squad.filter(p=>!p.starter);return `<section class="panel"><div class="heading"><div><div class="eyebrow">TAKTİK TAHTASI</div><h2>İlk 11 dizilişi</h2></div><span class="tag">${starters.length}/11 sahada</span></div><p class="muted">Oyuncuya dokun, sonra sahada istediğin yere dokun. Yedekten seçtiğin oyuncu sahadaki en yakın oyuncunun yerine geçer.</p><div class="tactic-row"><label class="small" for="formation">Diziliş</label><select class="input" id="formation" style="max-width:150px"><option ${s.formation==='4-3-3'?'selected':''}>4-3-3</option><option ${s.formation==='4-4-2'?'selected':''}>4-4-2</option><option ${s.formation==='3-5-2'?'selected':''}>3-5-2</option></select><span class="small">Hücum yönü ↑</span><button class="btn auto-xi" id="autoXI">✨ En iyi ilk 11</button></div><div class="pitch" id="pitch"><div class="goalbox top"></div><div class="goalbox bottom"></div>${starters.map(p=>`<button class="pitchPlayer ${selectedTacticPlayer===p.id?'selected':''}" data-pitch-player="${esc(p.id)}" style="left:${p.x}%;top:${p.y}%" title="${esc(p.name)}">${esc(p.name)}</button>`).join('')}</div><div class=" function bindTab(){document.querySelectorAll('[data-talk]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();if(!b.disabled)openTalk(b.getAttribute('data-talk'))});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render()});let search=document.getElementById('searchPlayer'),pos=document.getElementById('filterPos');if(search)search.oninput=filterCandidates;if(pos)pos.onchange=filterCandidates;let adv=document.getElementById('advanceWeek');if(adv)adv.onclick=advanceWeek;let reset=document.getElementById('saveReset');if(reset)reset.onclick=()=>{if(confirm('Menajerlik kariyerini sıfırlamak istiyor musun?')){localStorage.removeItem(KEY);s=null;render()}};document.querySelectorAll('[data-pitch-player]').forEach(b=>b.onclick=e=>{e.stopPropagation();selectedTacticPlayer=b.dataset.pitchPlayer;drawTab()});document.querySelectorAll('[data-bench-player]').forEach(b=>b.onclick=()=>{selectedTacticPlayer=b.dataset.benchPlayer;drawTab()});let pitch=document.getElementById('pitch');if(pitch)pitch.onclick=e=>{let r=pitch.getBoundingClientRect();placeAt(selectedTacticPlayer,clamp((e.clientX-r.left)/r.width*100,7,93),clamp((e.clientY-r.top)/r.height*100,5,95))};let formation=document.getElementById('formation');if(formation)formation.onchange=()=>setFormation(formation.value);let auto=document.getElementById('autoXI');if(auto)auto.onclick=autoSelectXI}
function placeAt(id,x,y){let p=s.squad.find(q=>q.id===id);if(!p)return;if(!p.starter){let starters=s.squad.filter(q=>q.starter);if(starters.length>=11){let replaced=starters.reduce((best,q)=>Math.hypot(q.x-x,q.y-y)<Math.hypot(best.x-x,best.y-y)?q:best,starters[0]);replaced.starter=false}else p.starter=true;p.starter=true}p.x=x;p.y=y;selectedTacticPlayer=null;save();drawTab()}
function setFormation(value){s.formation=value;let groups={'4-3-3':[[50,87],[22,73],[42,76],[58,76],[78,73],[34,57],[50,53],[66,57],[18,39],[50,34],[82,39]],'4-4-2':[[50,87],[22,73],[42,76],[58,76],[78,73],[18,53],[39,57],[61,57],[82,53],[38,35],[62,35]],'3-5-2':[[50,87],[28,75],[50,78],[72,75],[14,56],[33,57],[50,52],[67,57],[86,56],[39,35],[61,35]]},players=s.squad.filter(p=>p.starter),spots=groups[value];players.slice(0,11).forEach((p,i)=>{p.x=spots[i][0];p.y=spots[i][1]});save();drawTab()}function autoSelectXI(){let available=s.squad.slice(),chosen=[];function take(count,test){let picks=available.filter(test).sort((a,b)=>b.rating-a.rating).slice(0,count);picks.forEach(p=>{chosen.push(p);available=available.filter(q=>q.id!==p.id)})}let formation=s.formation||'4-3-3';take(1,p=>p.pos==='KL');if(formation==='4-4-2'){take(2,p=>p.pos==='STP');take(2,p=>p.pos==='SB');take(4,p=>p.pos==='OS');take(2,p=>p.pos==='SF')}else if(formation==='3-5-2'){take(3,p=>p.pos==='STP');take(3,p=>p.pos==='OS');take(2,p=>p.pos==='KAN'||p.pos==='SB');take(2,p=>p.pos==='SF')}else{take(2,p=>p.pos==='STP');take(2,p=>p.pos==='SB');take(3,p=>p.pos==='OS');take(2,p=>p.pos==='KAN');take(1,p=>p.pos==='SF')}while(chosen.length<11&&available.length){let best=available.slice().sort((a,b)=>b.rating-a.rating)[0];chosen.push(best);available=available.filter(p=>p.id!==best.id)}let layouts={'4-3-3':[[50,87],[22,73],[42,76],[58,76],[78,73],[34,57],[50,53],[66,57],[18,39],[50,34],[82,39]],'4-4-2':[[50,87],[22,73],[42,76],[58,76],[78,73],[18,53],[39,57],[61,57],[82,53],[38,35],[62,35]],'3-5-2':[[50,87],[28,75],[50,78],[72,75],[14,56],[33,57],[50,52],[67,57],[86,56],[39,35],[61,35]]},spots=layouts[formation];s.squad.forEach(p=>p.starter=chosen.some(q=>q.id===p.id));chosen.forEach((p,i)=>{p.x=spots[i][0];p.y=spots[i][1]});selectedTacticPlayer=null;save();drawTab()}function filterCandidates(){let q=(document.getElementById('searchPlayer').value||'').toLowerCase(),p=document.getElementById('filterPos').value;docu function toggleStarter(id){let p=s.squad.find(x=>x.id===id);if(!p)return;if(p.starter){p.starter=false}else{if(s.squad.filter(x=>x.starter).length>=11){let weakest=s.squad.filter(x=>x.starter).sort((a,b)=>a.rating-b.rating)[0];weakest.starter=false}p.starter=true}save();drawTab()}
function openTalk(id){let p=pool.find(x=>x.id===id);if(!p)return;talk={p,interest:32+(s.rep-25)*.25,demandLevel:p.level,demandWage:p.wage,demandFee:p.fee,offerWage:Math.round(p.wage*.95),offerFee:Math.round(p.fee*.9),promise:false,offerStatus:'none',round:0,messages:[{from:'agent',text:`Merhaba, ${p.name} adına ben konuşuyorum. Müvekkilim ${p.style}; takımda nasıl bir rol alacağını ve kulübün hedeflerini bilmek istiyor. Sezonluk maaş beklentimiz ${fmt(p.wage)}, bonservis için yaklaşık ${fmt(p.fee)} konuşabiliriz.`}]};drawTalk()}

cument.getElementById('offerFee').oninput=e=>talk.offerFee=(Number(e.target.value)||0)*EUR_RATE;document.getElementById('installments').onchange=e=>talk.installments=Number(e.target.value);document.getElementById('contractYears').onchange=e=>talk.contractYears=Number(e.target.value);document.getElementById('squadRole').onchange=e=>talk.role=e.target.value;document.getElementById('signingBonus').oninput=e=>talk.signingBonus=(Number(e.target.value)||0)*EUR_RATE;document.getElementById('appearanceBonus').oninput=e=>talk.appearanceBonus=(Number(e.target.value)||0)*EUR_RATE;document.getElementById('submitOffer').onclick=submitOffer;document.getElementById('signPlayer').onclick=signPlayer;let chat=document.getElementById('chat');chat.scrollTop=chat.scrollHeight}function submitOffer(){let wage=(Number(document.getElementById('offerWage').value)||0)*EUR_RATE,fee=(Number(document.getElementById('offerFee').value)||0)*EUR_RATE,installments=Number(document.getElementById('installments').value)||1,years=Number(document.getElementById('contractYears').value)||3,signingBonus=(Number(document.getElementById('signingBonus').value)||0)*EUR_RATE,appearanceBonus=(Number(document.getElementById('appearanceBonus').value)||0)*EUR_RATE,role=document.getElementById('squadRole').value,p=talk.p;Object.assign(talk,{offerWage:wage,offerFee:fee,installments,contractYears:years,signingBonus,appearanceBonus,role});let upfront=Math.ceil(fee/installments)+signingBonus,wr=wage/(talk.demandWage||1),fr=fee/(talk.demandFee||1),trust=talk.interest+(role==='Yıldız transfer'?10:role==='İlk 11'?8:role==='Önemli oyuncu'?5:0)+(talk.promise?5:0)+Math.min(8,signingBonus/Math.max(wage,1)*20);talk.messages.push({from:'me',text:`Resmî teklif: ${fmt(wage)} sezonluk maaş, ${fmt(fee)} bonservis (${installments===1?'peşin':installments+' taksit'}), ${years} sezon sözleşme, ${role} rolü${signingBonus?' ve '+fmt(signingBonus)+' imza bonusu':''}${appearanceBonus?' ve maç başı '+fmt(appearanceBonus)+' prim':''}.`});if(upfront>s.budget){talk.offerStatus='rejected';talk.messages.push({from:'agent',text:`İlk ödeme ${fmt(upfront)} tutuyor, bütçeniz ${fmt(s.budget)}. Daha fazla taksit veya daha düşük bonus deneyin.`});drawTalk();return}if(talk.demandLevel<=s.level&&trust>=30&&wr>=.9&&fr>=.8){talk.offerStatus='accepted';talk.interest=clamp(trust+8,0,100);talk.messages.push({from:'agent',text:`Teklifi kabul ediyoruz. ${p.name}, ${role.toLocaleLowerCase('tr')} rolüyle ${years} sezonluk sözleşmeye hazır. Taksitleri ve bonusları da kabul ettik; transferi tamamlayabilirsiniz.`})}else if(talk.demandLevel<=s.level&&trust>=20&&wr>=.65&&fr>=.55){talk.offerStatus='counter';talk.demandWage=Math.max(wage,Math.round(talk.demandWage*(wr<.9?.94:1)));talk.demandFee=Math.max(fee,Math.round(talk.demandFee*(fr<.8?.94:1)));talk.interest=clamp(trust+3,0,100);talk.messages.push({from:'agent',text:`Müvekkilim projeye sıcak bakıyor ama şartları iyileştirmemiz gerek. Maaş beklentimiz ${fmt(talk.demandWage)}, bonservis talebimiz ${fmt(talk.demandFee)}. ${role==='Rotasyon'?'Daha önemli bir kadro rolü kararını etkileyebilir.':''} Yeni teklifinizi bekliyoruz.`})}else{talk.offerStatus='rejected';talk.interest=clamp(trust-3,0,100);talk.messages.push({from:'agent',text:talk.demandLevel>s.level?'Müvekkilim bu aşamada transferi kariyer seviyeniz için uygun bulmuyor.':'Teklifi kabul edemiyoruz. Maaş, bonservis veya sunulan kadro rolünü yükseltip tekrar deneyin.'})}drawTalk()}function extractAmount(text,kind){let key=kind==='wage'?'(?:maaş|ücret|ucret)':'(?:bonservis|transfer bedeli)',m=text.match(new RegExp(key+'[^\\d]{0,20}(\\d[\\d.,]*)\\s*(milyar|milyon|mn|bin|k)?','i'));if(!m)return 0;let unit=(m[2]||'').toLocaleLowerCase('tr'),value;if(unit==='milyar')value=Number(m[1].replace(',','.'))*1e9;else if(unit==='milyon'||unit==='mn')value=Number(m[1].replace(',','.'))*1e6;else if(unit==='bin'||unit==='k')value=Number(m[1].replace(/\./g,'').replace(',','.'))*1e3;else value=Number(m[1].replace(/[.,]/g,''));return Number.isFinite(value)?Math.round(value):0}function sendMessage(){let input=document.getElementById('messageInput'),text=input.value.trim();if(!text)return;let low=text.toLocaleLowerCase('tr'),p=talk.p,wage=(Number(document.getElementById('offerWage').value)||0)*EUR_RATE,fee=(Number(document.getElementById('offerFee').value)||0)*EUR_RATE,amountWage=extractAmount(text,'wage'),amountFee=extractAmount(text,'fee');if(amountWage)wage=amountWage*EUR_RATE;if(amountFee)fee=amountFee*EUR_RATE;talk.offerWage=wage;talk.offerFee=fee;talk.offerStatus='none';talk.round++;talk.messages.push({from:'me',text});let before=talk.interest,delta=0;if(/ilk\s*11|ilk\s*onbir|garanti\s*forma|düzenli\s*oyna/.test(low)){talk.promise=true;delta+=14}if(/maaş|ucret|ücret|para|prim|bonus/.test(low))delta+=wage>=talk.demandWage?13:wage>=talk.demandWage*.82?7:-6;if(/bonservis|transfer bedeli/.test(low))delta+=fee>=talk.demandFee?8:fee>=talk.demandFee*.75?4:-3;if(/şampiyon|avrupa|kupa|proje|hedef|yüksel/.test(low))delta+=8;if(/genç|geliş|gelecek|potansiyel/.test(low))delta+=5;if(/merhaba|lütfen|rica|teklif|saygı|memnun/.test(low))delta+=3;if(/aptal|kötü|istemiyorum|boş|son şans/.test(low))delta-=16;if(text.length>80)delta+=2;talk.interest=clamp(talk.interest+delta,0,100);if(talk.interest>before){talk.demandWage=Math.max(p.wage*.78,Math.round(talk.demandWage*.975));talk.demandFee=Math.max(p.fee*.65,Math.round(talk.demandFee*.98))}let reply,ratio=wage/(talk.demandWage||1),feeRatio=fee/(talk.demandFee||1);if(/aptal|kötü|boş|son şans/.test(low))reply='Bu üslup müvekkilimi rahatsız etti. Görüşmeye devam edebiliriz ama güveni yeniden kazanmanız gerekecek.';else if(ratio<.62)reply=`Teklifiniz beklentimizin oldukça altında. Müvekkilim için sezonluk ${fmt(talk.demandWage)} maaş ve ${fmt(talk.demandFee)} bonservis seviyesine yaklaşmanız gerekiyor.`;else if(feeRatio<.58)reply=`Maaş teklifinizi not ettim. Kulübüyle anlaşmamız için ${fmt(talk.demandFee)} civarında bonservis de sunmalısınız.`;else if(talk.promise&&ratio>=.78)reply=`İlk 11 sözünüz ${p.name} için önemli. Bu rolü gerçekten verirseniz, ${fmt(wage)} maaş teklifinizi ve projenizi ciddi şekilde değerlendireceğiz.`;else if(/avrupa|şampiyon|kupa|hedef|proje/.test(low))reply=`Hedefiniz iddialı. ${p.style==='gelişim odaklı'?'Müvekkilim gelişebileceği ve düzenli oynayacağı bir ortam arıyor.':p.style==='lider'?'Soyunma odasında sorumluluk alabileceği bir rol bekliyor.':'Başarı hedefiniz ilgimizi çekti.'} Transfer şartlarını da bu hedefle uyumlu hale getirelim.`;else if(ratio>=.94&&feeRatio>=.85)reply=`Teklifiniz artık makul bir noktada. Güven seviyemiz ${Math.round(talk.interest)}%. Son maaş ve bonservis rakamlarını korursanız sözleşme taslağına geçebiliriz.`;else if(talk.interest>48)reply=`Müvekkilim kulübünüzü ve anlattığınız rolü daha ciddi değerlendiriyor. Son talebimizi ${fmt(talk.demandWage)} maaş ve ${fmt(talk.demandFee)} bonservis olarak güncelledik.`;else reply=`Mesajınızı aldım. ${p.name} ${p.style}; yalnızca para değil, takım içindeki rol ve hedeflerin de net olmasını istiyor. Teklifinizi ve planınızı biraz daha açar mısınız?`;talk.messages.push({from:'agent',text:reply});drawTalk()}
function closeTalk(){document.getElementById('modalBack').style.display='none';talk=null}function signPlayer(){let p=talk.p,ready=talk.offerStatus==='accepted'&&talk.demandLevel<=s.level;if(!ready){talk.messages.push({from:'agent',text:'Temsilci henüz bu teklifi kabul etmedi. Yeni teklif gönderip şartları görüşebilirsin.'});drawTalk();return}let fee=talk.offerFee,installments=talk.installments||1,signingBonus=talk.signingBonus||0,firstPayment=Math.ceil(fee/installments)+signingBonus;if(firstPayment>s.budget){talk.messages.push({from:'agent',text:`İlk ödeme ${fmt(firstPayment)}; mevcut bütçen ${fmt(s.budget)}. Taksit planını değiştir veya bonservisi düşür.`});drawTalk();return}s.budget-=firstPayment;s.payments=s.payments||[];let share=Math.ceil(fee/installments),remaining=fee-share;for(let i=1;i<installments&&remaining>0;i++){let amount=Math.min(share,remaining);remaining-=amount;s.payments.push({player:p.name,amount,due:s.played+i*8})}let starter=talk.promise||talk.role==='İlk 11'||talk.role==='Yıldız transfer',signed={id:p.id,name:p.name,pos:p.pos,rating:p.rating,age:p.age,wage:talk.offerWage,starter:false,...initialSpot(s.squad.length),promisedStart:starter,contractYears:talk.contractYears||3,squadRole:talk.role,signingBonus,appearanceBonus:talk.appearanceBonus||0,stats:{apps:0,goals:0,assists:0,avg:0}};if(starter){let weakest=s.squad.filter(x=>x.starter).sort((a,b)=>a.rating-b.rating)[0];if(weakest){signed.x=weakest.x;signed.y=weakest.y;weakest.starter=false}signed.starter=true;s.promises.push({id:p.id,name:p.name,type:'İlk 11',due:s.week+1})}s.squad.push(signed);s.signings++;s.rep=clamp(s.rep+3,0,100);xp(30);addLog(`${p.name} transfer edildi · ${talk.contractYears} sezon · ${fmt(talk.offerWage)}/sezon · ilk ödeme ${fmt(firstPayment)}.`);closeTalk();render()}function recordTable(home,away,hg,ag){let h=s.table.find(t=>t.team===home),a=s.table.find(t=>t.team===away);if(!h||!a)return;h.played++;a.played++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;if(hg>ag){h.wins++;h.points+=3;a.losses++}else if(hg<ag){a.wins++;a.points+=3;h.losses++}else{h.draws++;a.draws++;h.points++;a.points++}}
function scoreFor(outcome){if(outcome==='win'){let ours=1+Math.floor(Math.random()*3);return [ours,Math.floor(Math.random()*ours)]}if(outcome==='draw'){let n=Math.floor(Math.random()*3);return [n,n]}let theirs=1+Math.floor(Math.random()*3);return [Math.floor(Math.random()*theirs),theirs]}
function addPlayerMatchStats(starters,goals,won){let attackers=starters.filter(p=>['SF','KAN','10N'].includes(p.pos));if(!attackers.length)attackers=starters;starters.forEach(p=>{if(!p.stats)p.stats={apps:0,goals:0,assists:0,avg:0};let z=p.stats,perf=6.1+Math.random()*1.2+(won ? .75 : 0);z.apps++;z.avg=((z.avg*(z.apps-1))+perf)/z.apps});for(let i=0;i<goals;i++){let scorer=attackers[Math.floor(Math.random()*attackers.length)];scorer.stats.goals++;scorer.stats.avg=Math.min(10,scorer.stats.avg+.25);if(starters.length>1&&Math.random()<.68){let helpers=starters.filter(p=>p!==scorer);let helper=helpers[Math.floor(Math.random()*helpers.length)];helper.stats.assists++;helper.stats.avg=Math.min(10,helper.stats.avg+.18)}}}
function processTransferPayments(){if(!s.payments||!s.payments.length)return;let due=s.payments.filter(p=>p.due<=s.played);due.forEach(p=>{s.budget-=p.amount;addLog(`${p.player} transfer taksidi ödendi: ${fmt(p.amount)}.`)});s.payments=s.payments.filter(p=>p.due>s.played)}function advanceWeek(){let starters=s.squad.filter(p=>p.starter);if(starters.length<11){alert('Maçtan önce ilk 11’i 11 oyuncuya tamamla.');tab='squad';render();return}let round=s.fixtures[s.week-1]||[],fixture=round.find(m=>m.home===s.club||m.away===s.club);if(!fixture)return;let opponent=fixture.home===s.club?fixture.away:fixture.home,power=teamPower()+s.level*1.5,opponentStrength=64+((SUPER_TEAMS.concat(FIRST_TEAMS).indexOf(opponent)*7)%12),roll=Math.random()*100,winChance=clamp(48+(power-opponentStrength)*2,18,82),outcome=roll<winChance?'win':roll<winChance+22?'draw':'loss',[gf,ga]=scoreFor(outcome),ourHome=fixture.home===s.club;fixture.played=true;fixture.hg=ourHome?gf:ga;fixture.ag=ourHome?ga:gf;let matchWage=payroll();s.budget-=matchWage;if(outcome==='win'){s.wins++;s.budget+=1700000;xp(34);s.rep=clamp(s.rep+2,0,100)}else if(outcome==='draw'){s.draws++;s.budget+=950000;xp(18)}else{s.losses++;s.budget+=700000;xp(10);s.rep=clamp(s.rep-1,0,100)}addPlayerMatchStats(starters,gf,outcome==='win');round.forEach(m=>{if(m===fixture)recordTable(m.home,m.away,m.hg,m.ag);else{m.played=true;m.hg=Math.floor(Math.random()*4);m.ag=Math.floor(Math.random()*4);recordTable(m.home,m.away,m.hg,m.ag)}});addLog(`${opponent} karşısında ${outcome==='win'?'galibiyet':outcome==='draw'?'beraberlik':'mağlubiyet'}: ${gf}-${ga}. Haftalık maaş gideri ${fmt(matchWage)}.`);let remaining=[];s.promises.forEach(pr=>{let player=s.squad.find(x=>x.id===pr.id);if(player&&player.starter){s.rep=clamp(s.rep+4,0,100);xp(15);addLog(`${pr.name} için verdiğin ilk 11 sözünü tuttun; itibar ve XP kazandın.`)}else{s.rep=clamp(s.rep-8,0,100);addLog(`${pr.name} için verdiğin ilk 11 sözünü tutmadın; itibar kaybettin.`)}});s.promises=remaining;if(s.budget<0){s.rep=clamp(s.rep-3,0,100);addLog('Bütçe eksiye düştü; yönetim uyarı gönderdi.')}s.played++;processTransferPayments();starters.forEach(p=>{if(p.appearanceBonus)s.budget-=p.appearanceBonus});s.week++;if(s.week>s.fixtures.length){s.week=1;s.season++;s.wins=0;s.draws=0;s.losses=0;s.squad.forEach(p=>p.stats={apps:0,goals:0,assists:0,avg:0});s.fixtures=makeFixtures(s.league);s.table=(s.league.includes('Süper')?SUPER_TEAMS:FIRST_TEAMS).map(team=>({team,points:0,played:0,wins:0,draws:0,losses:0,gf:0,ga:0}));addLog(`${s.season}. sezon başladı; oyuncu istatistikleri sıfırlandı.`)}save();render()}function resetCareer(){localStorage.removeItem(KEY);s=null;tab='home';render()}
